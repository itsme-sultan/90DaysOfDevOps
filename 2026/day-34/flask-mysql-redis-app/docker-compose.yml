services:
  db:
    images: mysql
    container_name: flask_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_DATABASE: appdb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_nw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    images: redis:7-alpine

  web:
    build: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - app_nw
    environment:
      REDIS_HOST: redis
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb
    depends on:
      - db
      - redis

volumes:
  mysql_data

networks:
  app_nw
    driver: bridge